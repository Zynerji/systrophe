name: docs

# Builds the Sphinx site as a sanity check. Pages deployment is
# disabled here because GitHub Pages is not enabled on this repo
# (the deploy-pages action returns 404). To re-enable: turn on Pages
# at https://github.com/Zynerji/systrophe/settings/pages then restore
# the `deploy` job below.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + Sphinx
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install sphinx alabaster
      - name: Build docs (sanity check)
        run: |
          sphinx-build -b html docs docs/_build/html
