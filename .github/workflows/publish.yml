name: Publish to PyPI

# Triggered manually or on a v* tag push.
# Requires PyPI Trusted Publishing to be configured for this repo
# (https://docs.pypi.org/trusted-publishers/), so no API token is
# stored in the repo or in GitHub secrets.
#
# To publish a release:
#   1. Bump version in pyproject.toml and src/systrophe/__init__.py
#   2. Update CHANGELOG.md
#   3. git tag vX.Y.Z && git push --tags
# This workflow then builds sdist + wheel and uploads to PyPI.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
