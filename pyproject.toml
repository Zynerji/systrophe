[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systrophe"
version = "0.21.0"
description = "Co-rotating dust cylinder pair, van Stockum / Tipler exterior with log-periodic sinusoid superposition"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Christian Knopp", email = "cknopp@gmail.com" }]
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "sympy>=1.12"]
symbolic = ["sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
