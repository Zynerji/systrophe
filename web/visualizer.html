<!doctype html>
<html><head><meta charset="utf-8"><title>Systrophe · Tipler ternary</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;display:grid;place-items:center;font-family:ui-monospace,Menlo,monospace}
canvas{display:block}
.cap{position:fixed;bottom:8px;left:12px;color:#a8f;font:11px ui-monospace,monospace;max-width:920px;line-height:1.4}
.cap b{color:#ddf}
.cap em{color:#888;font-style:normal}
.help{position:fixed;top:8px;right:12px;color:#666;font:11px ui-monospace,monospace;text-align:right;line-height:1.5}
.help kbd{background:#222;color:#aaa;border:1px solid #444;padding:0 4px;border-radius:3px}
.title{position:fixed;top:8px;left:12px;color:#5af;font:11px ui-monospace,monospace}
.title b{color:#ace}
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head><body>
<div class="title"><b>Συστροφή · Systrophe</b> &nbsp;·&nbsp; Tipler / van Stockum ternary</div>
<div class="cap" id="cap"></div>
<div class="help">
<kbd>1</kbd>–<kbd>8</kbd> scene · <kbd>drag</kbd> pan · <kbd>scroll</kbd> zoom<br>
<kbd>←→↑↓</kbd> pan · <kbd>T</kbd>/<kbd>G</kbd> tilt · <kbd>Q</kbd>/<kbd>E</kbd> spin · <kbd>R</kbd> reset · <kbd>Space</kbd> slow
</div>
<script>
'use strict';

// ----- Math kernel (Tipler / van Stockum / etc.) ---------------------------
const Z3 = 2 * Math.PI / 3;

function tF(r, omega, R){
  const a = omega*R, alpha = Math.sqrt(4*a*a - 1);
  const gamma = Math.PI - Math.atan(alpha);
  const u = Math.log(r/R);
  return (r/R) * Math.sin(alpha*u + gamma) / Math.sin(gamma);
}
function tK(r, omega, R){
  const a = omega*R, alpha = Math.sqrt(4*a*a - 1);
  const gamma = Math.PI - Math.atan(alpha);
  const u = Math.log(r/R);
  const th = alpha*u + gamma;
  return (r/alpha) * (((alpha*alpha - 1)/2)*Math.sin(th) - alpha*Math.cos(th));
}
function tL(r, omega, R){
  const a = omega*R, alpha = Math.sqrt(4*a*a - 1);
  const gamma = Math.PI - Math.atan(alpha);
  const Q = alpha*alpha - Math.pow(alpha*alpha - 1, 2)/4;
  const u = Math.log(r/R);
  const th = alpha*u + gamma;
  return (r*R*Math.sin(gamma)/(alpha*alpha)) *
    (Q*Math.sin(th) + alpha*(alpha*alpha - 1)*Math.cos(th));
}
function tAlpha(omega, R){ return Math.sqrt(4*(omega*R)**2 - 1); }

// Goedel: g_phiphi = a^2 sinh^2(r) (1 - sinh^2 r)
function godelL(r){ const s = Math.sinh(r); return s*s*(1 - s*s); }

// Gott CTC functional gv - tan(4 pi mu)
function gottMargin(mu, v){ const g = 1/Math.sqrt(1 - v*v); return g*v - Math.tan(4*Math.PI*mu); }

// Kerr equatorial g_phiphi = r^2 + a^2 + 2 M a^2 / r
function kerrGphi(r, M, a){ return r*r + a*a + 2*M*a*a / r; }

// ----- p5 sketch -----------------------------------------------------------
const W = 960;
const FADE = 0.06;
let scene = 1;
let t = 0;
let cx = 0, cy = 0, sc = 1, spin = 0, tilt = 0;
let slow = false;

const SCENES = {
  1: {
    title: 'Single Tipler sinusoid',
    desc: 'F(r), K(r), L(r) of the analytic Case III exterior plotted as three phase-shifted point clouds in (ln r, value)-space. Slow log-periodic oscillation; the L-curve dipping below the axis marks a CTC band.',
    omega: 1.0,
  },
  2: {
    title: 'Off-set pair · ternary interference',
    desc: 'Three-coloured ternary visualisation of the L-sinusoids: cyl 1 (red), cyl 2 (green), sum (blue). δ slides; at δ=π the sum vanishes — anti-phase extinction.',
    omega: 1.5,
  },
  3: {
    title: 'N-cylinder phased array',
    desc: 'Z_N copies of the Tipler L-sinusoid at phases 2πk/N. The sum goes to zero exactly (geometric sum of N-th roots of unity). Topological off-switch.',
  },
  4: {
    title: 'Off-axis pair · 2D CTC pdf',
    desc: 'Two parallel-axis cylinders separated by d. Sample (x, y) uniformly; a point joins the cloud only where g_φφ < 0 (CTC). The visible cloud is the joint CTC region.',
  },
  5: {
    title: 'Closed timelike curve worldline',
    desc: 'Particle on constant-r circular orbit at Ω<0 in a CTC band. The 3D helix projected onto (x, y) shows a closed loop; the colour gradient encodes coord-time t (green=now, red=past).',
  },
  6: {
    title: 'CTC zoo · four spacetimes',
    desc: 'Four glyphs: Tipler log-periodic sinusoid (cyan), Gödel sinh²-sinh⁴ curve (magenta), Gott pair γv-tan(4πμ) margin (green), Kerr equatorial g_φφ near r→0⁻ (orange).',
  },
  7: {
    title: 'Trace anomaly · Cauchy horizons',
    desc: '⟨T^μ_μ⟩ ∝ K_Kretschmann sampled along log-r. Spikes at F=0 mark Cauchy-horizon candidates: divergent classical-on-quantum back-reaction.',
    omega: 1.0,
  },
  8: {
    title: 'Unified picture',
    desc: 'Off-set Systrophe pair, Cauchy-horizon rings, CTC bands, and a particle on a closed timelike orbit, evolving in time. The full geometry, animated.',
    omega: 1.2, delta: 0.5,
  },
};

function setup(){
  createCanvas(W, W);
  background(0);
  colorMode(HSB, 360, 100, 100, 1);
  setCap();
}

function setCap(){
  const s = SCENES[scene];
  document.getElementById('cap').innerHTML =
    `<b>${scene} · ${s.title}</b> &nbsp; ${s.desc}` +
    (s.omega ? ` &nbsp; <em>ω=${s.omega}</em>` : '');
}

function keyPressed(){
  if (key === 'r' || key === 'R'){ recenter(); background(0); }
  if (key === ' '){ slow = !slow; }
  const k = parseInt(key, 10);
  if (k >= 1 && k <= 8){
    scene = k; t = 0; recenter(); background(0); setCap();
  }
}
function mouseDragged(){ cx += movedX; cy += movedY; }
function mouseWheel(e){ sc *= e.delta < 0 ? 1.07 : 1/1.07; return false; }
function pollKeys(){
  if (keyIsDown(LEFT_ARROW))  cx += 8;
  if (keyIsDown(RIGHT_ARROW)) cx -= 8;
  if (keyIsDown(UP_ARROW))    cy += 8;
  if (keyIsDown(DOWN_ARROW))  cy -= 8;
  if (keyIsDown(84)) tilt -= 0.02;  // T
  if (keyIsDown(71)) tilt += 0.02;  // G
  if (keyIsDown(81)) spin -= 0.02;  // Q
  if (keyIsDown(69)) spin += 0.02;  // E
  tilt = constrain(tilt, -1.35, 1.35);
}
function recenter(){ cx = 0; cy = 0; sc = 1; spin = 0; tilt = 0; }

function frameTrails(){
  noStroke();
  fill(0, 0, 0, slow ? 0.02 : FADE);
  rect(0, 0, W, W);
}

function applyTransform(){
  push();
  translate(W/2, W/2);
  scale(sc); rotate(spin); scale(1, Math.cos(tilt));
  translate(cx, cy);
}

// ----- Scene 1: Single Tipler ----------------------------------------------
function sceneSingle(){
  const omega = 1.0, R = 1.0;
  const components = [
    { fn: r => tF(r, omega, R), hue: 200, label: 'F' },
    { fn: r => tK(r, omega, R), hue: 130, label: 'K/r' },
    { fn: r => tL(r, omega, R), hue: 0,   label: 'L/r' },
  ];
  const ctx = drawingContext;
  for (let br = 0; br < 3; br++){
    const c = components[br];
    fill(c.hue, 80, 100, 0.42);
    ctx.beginPath();
    const N = 1500;
    for (let i = 0; i < N; i++){
      const u = -1 + 5 * (i / (N - 1));
      const r = Math.exp(u);
      let v = c.fn(r);
      // normalise: F as is, K/r, L/r so scales match
      if (c.label === 'K/r') v /= r;
      if (c.label === 'L/r') v /= r;
      // tiny temporal modulation so the cloud breathes
      const wob = 0.05 * Math.sin(t * 0.7 + br * Z3);
      const x = u * 130;
      const y = -Math.tanh(v * 0.4 + wob) * 240;
      ctx.rect(x, y, 1.2, 1.2);
    }
    ctx.fill();
  }
  // axis line
  fill(0, 0, 50, 0.08);
  ctx.beginPath();
  for (let i = 0; i < 800; i++) ctx.rect(-300 + i, 0, 1, 0.4);
  ctx.fill();
}

// ----- Scene 2: Off-set pair ternary --------------------------------------
function scenePair(){
  const omega = 1.5, R = 1.0;
  const alpha = tAlpha(omega, R);
  const delta = (1 + Math.sin(t * 0.4)) * Math.PI;  // sweeps 0 .. 2π .. 0
  const ctx = drawingContext;
  // three branches: cyl1, cyl2, sum
  for (let br = 0; br < 3; br++){
    const hue = [0, 130, 220][br];
    fill(hue, 85, 100, 0.32);
    ctx.beginPath();
    const N = 2000;
    for (let i = 0; i < N; i++){
      const u = -0.5 + 4.5 * (i / (N - 1));
      const r = Math.exp(u);
      let v;
      if (br === 0) v = tL(r, omega, R);
      else if (br === 1) v = tL(r * Math.exp(-delta/alpha), omega, R);
      else v = tL(r, omega, R) + tL(r * Math.exp(-delta/alpha), omega, R);
      v /= r;
      const x = u * 130;
      const y = -Math.tanh(v * 0.05) * 250;
      ctx.rect(x, y, 1.2, 1.2);
    }
    ctx.fill();
  }
  // Caption update with delta
  document.getElementById('cap').innerHTML =
    `<b>${scene} · ${SCENES[2].title}</b> &nbsp; ${SCENES[2].desc} &nbsp; <em>δ=${delta.toFixed(2)}</em>`;
}

// ----- Scene 3: N-cylinder array -------------------------------------------
function sceneArray(){
  const omega = 1.5, R = 1.0;
  const alpha = tAlpha(omega, R);
  const N = 5;
  const ctx = drawingContext;
  for (let k = 0; k < N; k++){
    const hue = (k / N) * 360;
    fill(hue, 85, 95, 0.28);
    ctx.beginPath();
    const M = 1500;
    const delta_k = (2 * Math.PI * k) / N;
    for (let i = 0; i < M; i++){
      const u = -0.5 + 5 * (i / (M - 1));
      const r = Math.exp(u);
      let v = tL(r * Math.exp(-delta_k / alpha), omega, R) / r;
      const x = u * 130;
      const y = -Math.tanh(v * 0.05) * 250;
      ctx.rect(x, y, 1.0, 1.0);
    }
    ctx.fill();
  }
  // Sum (the extinction): white pulse
  fill(0, 0, 100, 0.25);
  ctx.beginPath();
  for (let i = 0; i < 1500; i++){
    const u = -0.5 + 5 * (i / 1499);
    const r = Math.exp(u);
    let total = 0;
    for (let k = 0; k < N; k++){
      const delta_k = (2 * Math.PI * k) / N;
      total += tL(r * Math.exp(-delta_k / alpha), omega, R) / r;
    }
    const x = u * 130;
    const y = -Math.tanh(total * 0.05) * 250;
    ctx.rect(x, y, 2.0, 2.0);
  }
  ctx.fill();
}

// ----- Scene 4: Off-axis pair 2D CTC pdf ----------------------------------
function sceneOffAxis(){
  const omega = 1.0, R = 1.0;
  const d = 4.0;
  const ctx = drawingContext;
  // Sample (x, y) uniformly; emit a point only where g_phiphi < 0.
  // Three colour channels for ternary chirality based on which cylinder dominates.
  const SAMPLES = 1200;
  for (let s = 0; s < SAMPLES; s++){
    const x = -3 + 11 * Math.random();
    const y = -4 + 8 * Math.random();
    const r1 = Math.max(Math.sqrt(x*x + y*y), R*1.05);
    const r2 = Math.max(Math.sqrt((x-d)**2 + y*y), R*1.05);
    const L1 = tL(r1, omega, R);
    const L2 = tL(r2, omega, R);
    const total = L1 + L2;
    if (total >= 0) continue;
    // Hue from which dominates
    let hue;
    if (Math.abs(L1) > Math.abs(L2)) hue = 0;
    else if (Math.abs(L2) > Math.abs(L1) * 1.5) hue = 130;
    else hue = 245;
    const X = (x - (d - 0) / 2) * 50;
    const Y = -y * 50;
    fill(hue, 90, 100, 0.45);
    ctx.beginPath();
    ctx.rect(X, Y, 1.5, 1.5);
    ctx.fill();
  }
  // Axis markers
  for (const [px, py] of [[0, 0], [d, 0]]){
    const X = (px - d/2) * 50;
    const Y = -py * 50;
    fill(60, 100, 100, 0.4);
    ctx.beginPath();
    ctx.arc(X, Y, 4, 0, 2*Math.PI);
    ctx.fill();
  }
}

// ----- Scene 5: Closed timelike curve worldline ---------------------------
function sceneWorldline(){
  const rOrbit = 3.35, Omega = -2 * Math.PI;
  const Nrev = 5;
  const ctx = drawingContext;
  // Build the helix in (x, t)-space + colour gradient
  const N = 800;
  for (let i = 0; i < N; i++){
    const phi = 2 * Math.PI * Nrev * i / (N - 1);
    const tCoord = phi / Omega;  // negative
    const xs = rOrbit * Math.cos(phi + t * 0.3);
    const zs = rOrbit * Math.sin(phi + t * 0.3);
    // Project: x = xs + tCoord*0.6 (slant for time axis), y = zs + tCoord*0.4
    const X = xs * 50 + tCoord * 30;
    const Y = -zs * 50 + tCoord * 30;
    const phase = i / (N - 1);
    const hue = 130 - 130 * phase;  // green -> red
    fill(hue, 85, 100, 0.32);
    ctx.beginPath();
    ctx.rect(X, Y, 1.4, 1.4);
    ctx.fill();
  }
}

// ----- Scene 6: CTC zoo ----------------------------------------------------
function sceneZoo(){
  const ctx = drawingContext;
  // Four quadrants, each plotting a different CTC characteristic curve
  // 1. Tipler: F(r) log-periodic
  fill(195, 80, 100, 0.35);
  ctx.beginPath();
  for (let i = 0; i < 1000; i++){
    const u = -0.3 + 3.5 * (i / 999);
    const r = Math.exp(u);
    const F = tF(r, 1.0, 1.0);
    ctx.rect(-W*0.25 + u * 60, -W*0.25 - Math.tanh(F * 0.4) * 100, 1.2, 1.2);
  }
  ctx.fill();
  // 2. Goedel: g_phiphi = sinh^2 r (1 - sinh^2 r)
  fill(320, 80, 100, 0.35);
  ctx.beginPath();
  for (let i = 0; i < 1000; i++){
    const r = 0.05 + 1.4 * (i / 999);
    const v = godelL(r);
    ctx.rect(W*0.25 + r * 130 - 90, -W*0.25 - v * 80, 1.2, 1.2);
  }
  ctx.fill();
  // 3. Gott margin
  fill(130, 80, 100, 0.35);
  ctx.beginPath();
  for (let i = 0; i < 1000; i++){
    const v = 0.01 + 0.95 * (i / 999);
    const margin = gottMargin(0.08, v);
    ctx.rect(-W*0.25 + v * 320 - 160, W*0.25 - Math.tanh(margin) * 80, 1.2, 1.2);
  }
  ctx.fill();
  // 4. Kerr equatorial g_phiphi (negative-r region)
  fill(35, 90, 100, 0.35);
  ctx.beginPath();
  for (let i = 0; i < 1000; i++){
    const r = -2 + 1.95 * (i / 999);
    const v = kerrGphi(r, 1.0, 0.9);
    ctx.rect(W*0.25 + r * 80 + 80, W*0.25 - Math.tanh(v * 0.1) * 100, 1.2, 1.2);
  }
  ctx.fill();
  // labels (faint)
  noFill(); textSize(11); textAlign(CENTER);
  fill(195, 50, 70, 0.6); text('Tipler · log-periodic F(r)', -W*0.25, -W*0.25 + 130);
  fill(320, 50, 70, 0.6); text('Gödel · sinh²-sinh⁴', W*0.25, -W*0.25 + 130);
  fill(130, 50, 70, 0.6); text('Gott · γv-tan(4πμ)', -W*0.25, W*0.25 + 130);
  fill(35, 50, 70, 0.6); text('Kerr · negative-r g_φφ', W*0.25, W*0.25 + 130);
}

// ----- Scene 7: Trace anomaly & Cauchy horizons ---------------------------
function sceneAnomaly(){
  const omega = 1.0, R = 1.0;
  const ctx = drawingContext;
  // Indicator log(1 + 1/F^2) along ln r, painted in three Z3-shifted phases
  for (let br = 0; br < 3; br++){
    const ph = br * Z3;
    const hue = [200, 320, 60][br];
    fill(hue, 85, 100, 0.3);
    ctx.beginPath();
    const N = 1500;
    for (let i = 0; i < N; i++){
      const u = -0.4 + 4.5 * (i / (N - 1));
      const r = Math.exp(u);
      const F = tF(r, omega, R);
      const ind = Math.log(1 + 1 / (F*F + 1e-9));
      const wob = 0.4 * Math.sin(t * 0.5 + ph);
      const x = u * 130;
      const y = -Math.min(ind * 35, 280) + wob;
      ctx.rect(x, y, 1.4, 1.4);
    }
    ctx.fill();
  }
  // Cauchy-horizon markers: red bursts at F = 0 zeros
  const alpha = tAlpha(omega, R);
  const gamma = Math.PI - Math.atan(alpha);
  fill(0, 100, 100, 0.55);
  ctx.beginPath();
  for (let n = 1; n < 5; n++){
    const u_n = (n * Math.PI - gamma) / alpha;
    if (u_n <= 0 || u_n > 4.5) continue;
    const x = u_n * 130;
    const burst = 12 + 4 * Math.sin(t * 4 + n);
    ctx.arc(x, -260, burst, 0, 2 * Math.PI);
  }
  ctx.fill();
}

// ----- Scene 8: Unified picture --------------------------------------------
function sceneUnified(){
  const omega = 1.2, R = 1.0;
  const alpha = tAlpha(omega, R);
  const delta = 0.4 + 1.8 * (0.5 + 0.5 * Math.sin(t * 0.3));
  const ctx = drawingContext;
  // Joint Tipler L_pair(r) phi-distributed point cloud (Z3 hues)
  for (let br = 0; br < 3; br++){
    const ph = br * Z3;
    const hue = [200, 0, 130][br];
    fill(hue, 80, 95, 0.25);
    ctx.beginPath();
    const M = 2200;
    for (let i = 0; i < M; i++){
      const u = -0.4 + 4.0 * (i / (M - 1));
      const r = Math.exp(u);
      const Lp = (tL(r, omega, R) + tL(r * Math.exp(-delta/alpha), omega, R)) / r;
      const phi = i * 0.013 + t * 0.4 + ph;
      // polar (r, phi) - choose r in pixels from log-r
      const rr = u * 70 + 240;
      const X = rr * Math.cos(phi);
      const Y = rr * Math.sin(phi);
      // Modulate brightness by sign of L_pair
      if (Lp < 0) fill(0, 95, 100, 0.45);
      else fill(hue, 80, 90, 0.18);
      ctx.beginPath();
      ctx.rect(X, Y, 1.3, 1.3);
      ctx.fill();
    }
  }
  // Cauchy-horizon ring markers (faint orange concentric circles)
  const gamma = Math.PI - Math.atan(alpha);
  noFill(); strokeWeight(1); stroke(35, 90, 100, 0.45);
  for (let n = 1; n < 4; n++){
    const u_n = (n * Math.PI - gamma) / alpha;
    if (u_n <= 0 || u_n > 4) continue;
    const rr = u_n * 70 + 240;
    ellipse(0, 0, 2 * rr, 2 * rr);
  }
  noStroke();
  // A single "engineered" particle on a CTC orbit
  const r_orb = 280;
  const phi_p = -t * 1.1;
  fill(50, 100, 100, 0.85);
  ellipse(r_orb * Math.cos(phi_p), r_orb * Math.sin(phi_p), 8, 8);
  // Fading trail
  for (let i = 1; i < 50; i++){
    const phi_i = phi_p - i * 0.04;
    fill(50, 100, 100, 0.4 - i * 0.008);
    ellipse(r_orb * Math.cos(phi_i), r_orb * Math.sin(phi_i), 4, 4);
  }
  // Cylinder-axis markers (twin dots)
  fill(195, 100, 100, 0.7);
  ellipse(0, 0, 10, 10);
  fill(35, 100, 100, 0.7);
  ellipse(15, 0, 8, 8);
  // Caption
  document.getElementById('cap').innerHTML =
    `<b>${scene} · ${SCENES[8].title}</b> &nbsp; ${SCENES[8].desc} &nbsp; <em>δ=${delta.toFixed(2)}</em>`;
}

function draw(){
  pollKeys();
  frameTrails();
  applyTransform();
  switch (scene){
    case 1: sceneSingle(); break;
    case 2: scenePair(); break;
    case 3: sceneArray(); break;
    case 4: sceneOffAxis(); break;
    case 5: sceneWorldline(); break;
    case 6: sceneZoo(); break;
    case 7: sceneAnomaly(); break;
    case 8: sceneUnified(); break;
  }
  pop();
  t += slow ? Math.PI / 4000 : Math.PI / 1000;
}
</script>
</body></html>
